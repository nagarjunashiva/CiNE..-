    <style>
        html {
            scroll-behavior: smooth
        }

        body {
            background: #080909;
            color: #F5F5F5;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden
        }

        ::selection {
            background: #E5242A;
            color: #fff
        }

        :focus-visible {
            outline: 2px solid #E5242A;
            outline-offset: 2px;
            border-radius: 6px
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none
        }

        .no-scrollbar {
            scrollbar-width: none;
            -ms-overflow-style: none
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 8px
        }

        ::-webkit-scrollbar-thumb {
            background: #242828;
            border-radius: 8px;
            border: 2px solid #080909
        }

        ::-webkit-scrollbar-track {
            background: #080909
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(26px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        @keyframes pageIn {
            from {
                opacity: 0;
                transform: translateY(12px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -500px 0
            }

            100% {
                background-position: 500px 0
            }
        }

        .shimmer {
            background: linear-gradient(90deg, #101212 25%, #1a1e1e 40%, #101212 60%);
            background-size: 900px 100%;
            animation: shimmer 1.5s linear infinite
        }

        .anim-hero {
            animation: fadeUp .9s cubic-bezier(.22, 1, .36, 1) both
        }

        .anim-hero-d1 {
            animation: fadeUp .9s .08s cubic-bezier(.22, 1, .36, 1) both
        }

        .anim-hero-d2 {
            animation: fadeUp .9s .16s cubic-bezier(.22, 1, .36, 1) both
        }

        .anim-hero-d3 {
            animation: fadeUp .9s .24s cubic-bezier(.22, 1, .36, 1) both
        }

        .page-enter {
            animation: pageIn .45s ease both
        }

        .fade-in {
            animation: fadeIn .5s ease both
        }

        /* ==================== SLIDING AUTH CARD (Login.css) ==================== */
        .card {
            position: relative;
            width: 840px;
            max-width: 100%;
            min-height: 560px;
            background: #0f1113;
            border-radius: 28px;
            box-shadow: 0 35px 90px -15px rgba(0, 0, 0, 0.98), 0 0 50px -10px rgba(229, 36, 42, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            display: flex;
        }

        .card-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            overflow: hidden;
            background: #080909;
            transition: transform 0.65s cubic-bezier(0.77, 0, 0.175, 1);
            z-index: 10;
            pointer-events: none;
            box-shadow: 0 0 60px rgba(229, 36, 42, 0.45);
        }

        .card-bg-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 25%;
            filter: brightness(0.85) contrast(1.15) saturate(1.1);
            transform: scale(1.08);
            transition: transform 0.8s ease;
        }

        .card-bg-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(8, 9, 9, 0.78) 0%, rgba(229, 36, 42, 0.38) 50%, rgba(8, 9, 9, 0.92) 100%);

        .card-bg-badge {

            bottom: 24px;
            left: 24px;
            right: 24px;

            justify-content: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 9999px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.85);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;

        .card-bg:not(.login) {

        }

            background: rgba(229, 36, 42, 0.25);
            border: 1px solid rgba(229, 36, 42, 0.5);
            color: #FFFFFF;
            margin-bottom: 12px;
        }

        .hero h2 {
            font-family: 'Sora', sans-serif;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 10px;

            margin-bottom: 24px;

        .hero-perk {

        .hero.register {

            text-align: center;
            line-height: 1.4;
        }

        .form form {

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Input Groups */
        .auth-input-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 10px;
        }

        .auth-input-icon {

            left: 14px;
            top: 50%;

            color: rgba(255, 255, 255, 0.35);

        .auth-input-wrapper:focus-within .auth-input-icon {

        }

        .auth-input {

        .auth-input:focus {

        }

        .auth-pass-toggle {

            right: 14px;
            top: 50%;
            transform: translateY(-50%);

            background: transparent;
            border: none;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .auth-pass-toggle:hover {
            color: #FFFFFF;
        }

        /* Buttons & Checkbox */
        .auth-btn-primary {
            width: 100%;
            padding: 12px 18px;
            border-radius: 12px;
            background: linear-gradient(135deg, #E5242A 0%, #ba161c 100%);
            color: #FFFFFF;
            border: none;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(229, 36, 42, 0.6);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
        }

        .auth-btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #f3353b 0%, #E5242A 100%);
            transform: translateY(-1px);
            box-shadow: 0 14px 30px -5px rgba(229, 36, 42, 0.75);
        }

        .auth-btn-primary:active:not(:disabled) {
            transform: scale(0.98);
        }

        .auth-btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #FFFFFF;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .auth-remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-top: 4px;
            margin-bottom: 8px;
            font-size: 11px;
        }

        .auth-checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            user-select: none;
        }

        .auth-checkbox {
            accent-color: #E5242A;
            cursor: pointer;
            width: 13px;
            height: 13px;
        }

        .auth-forgot-link {
            color: rgba(255, 255, 255, 0.55);
            background: transparent;
            border: none;
            padding: 0;
            font-size: 11px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .auth-forgot-link:hover {
            color: #E5242A;
            text-decoration: underline;
        }

        /* Watchlist Pop-up Callout */
        .watchlist-pop-badge {
            width: 100%;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 12px;
            background: linear-gradient(135deg, rgba(229, 36, 42, 0.18) 0%, rgba(229, 36, 42, 0.06) 100%);
            border: 1px solid rgba(229, 36, 42, 0.45);
            border-radius: 12px;
            margin-bottom: 14px;
            box-shadow: 0 4px 15px rgba(229, 36, 42, 0.15);
            animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.96) translateY(-4px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Error and Alert banners */
        .auth-alert-err {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 12px;
            border-radius: 10px;
            background: rgba(229, 36, 42, 0.12);
            border: 1px solid rgba(229, 36, 42, 0.35);
            color: #ff6b70;
            font-size: 11px;
            margin-bottom: 12px;
            text-align: left;
            line-height: 1.4;
        }

        /* OTP Input */
        .auth-otp-input {
            width: 100%;
            letter-spacing: 10px;
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            font-family: monospace;
            padding: 12px 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(229, 36, 42, 0.4);
            border-radius: 12px;
            color: #FFFFFF;
            outline: none;
            margin-bottom: 6px;
            transition: all 0.25s ease;
        }

        .auth-otp-input:focus {
            border-color: #E5242A;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(229, 36, 42, 0.35);
        }

        .otp-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-top: 12px;
            font-size: 11px;
        }

        .otp-timer {
            color: rgba(255, 255, 255, 0.45);
        }

        .otp-resend-btn {
            background: transparent;
            border: none;
            color: #E5242A;
            font-weight: 700;
            cursor: pointer;
            padding: 0;
            font-size: 11px;
            text-decoration: underline;
        }

        .otp-back-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.55);
            cursor: pointer;
            padding: 0;
            font-size: 11px;
            transition: color 0.2s;
        }

        .otp-back-btn:hover {
            color: #FFFFFF;
        }

        .auth-close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 40;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.55);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .auth-close-btn:hover {
            border-color: #E5242A;
            color: #E5242A;
            transform: scale(1.05);
        }

        .auth-backend-badge {
            position: absolute;
            top: 18px;
            left: 20px;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.online {
            background: #34d399;
            box-shadow: 0 0 10px #34d399;
        }

        .status-dot.offline {
            background: #fbbf24;
            box-shadow: 0 0 10px #fbbf24;
        }

        .mobile-auth-tabs {
            display: none;
        }

        .form.login {
            left: 0;
            right: auto;
            transform: translateX(0);
            opacity: 1;
            pointer-events: auto;
            z-index: 5;
        }

        .form.login:not(.active) {
            transform: translateX(-40%);
            opacity: 0;
            pointer-events: none;
            z-index: 1;
        }

        .form.register {
            left: 50%;
            right: auto;
            transform: translateX(0);
            opacity: 1;
            pointer-events: auto;
            z-index: 5;
        }

        .form.register:not(.active) {

            opacity: 0;
            pointer-events: none;
            z-index: 1;
        }

        @media (max-width: 768px) {
            .card {
                min-height: auto;
                max-height: 90vh;
                flex-direction: column;
                padding-top: 50px;
            }
            .card-bg {
                display: none;
            }
            .hero {
                display: none !important;
            }
            .form {
                position: relative;
                width: 100%;
                height: auto;
                padding: 10px 20px 24px;
                left: 0 !important;
                transform: none !important;
            }
            .form:not(.active) {
                display: none !important;
            }
            .mobile-auth-tabs {
                display: flex;
                width: calc(100% - 40px);
                margin: 0 20px 10px;
                background: rgba(255, 255, 255, 0.06);
                border-radius: 12px;
                padding: 4px;
                border: 1px solid rgba(255, 255, 255, 0.08);
            }
            .mobile-auth-tab {
                flex: 1;
                padding: 8px 12px;
                font-size: 12px;
                font-weight: 700;

                border: none;

            .mobile-auth-tab.active {
                background: #E5242A;
                color: #FFFFFF;

        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
                scroll-behavior: auto !important
            }
        }
    </style>
</head>

<body>
    <div id="root">
        <div

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback, createContext, useContext } = React;

        /* ============================================================
           CONFIG — paste a TMDB API key (or read token) to go live.
           With no key configured, CiNE.. runs on a curated local dataset.
        ============================================================ */
        const PROXY_BASE = "https://cine-proxy.nagarjunashivaa.workers.dev";
        const CONFIG = { TMDB_API_KEY: "e657810f1e0dcb2d3d6e2e5144eb224d", TMDB_READ_TOKEN: "", TMDB_BASE: `${PROXY_BASE}/3` };

        // 4K Ultra-HD Image URLs (Primary via Cloudflare proxy, Fallback via direct TMDB)
        const IMG_POSTER = p => p ? `${PROXY_BASE}/image/t/p/w780${p}` : null;
        const IMG_DIRECT_POSTER = p => p ? `https://image.tmdb.org/t/p/w780${p}` : null;
        const IMG_BACKDROP = p => p ? `${PROXY_BASE}/image/t/p/original${p}` : null;
        const IMG_DIRECT_BACKDROP = p => p ? `https://image.tmdb.org/t/p/original${p}` : null;
        const PICSUM = id => `https://picsum.photos/seed/cine-${id}/1600/900?grayscale`;

        const GENRES = { 28: "Action", 12: "Adventure", 16: "Animation", 35: "Comedy", 80: "Crime", 99: "Documentary", 18: "Drama", 10751: "Family", 14: "Fantasy", 36: "History", 27: "Horror", 10402: "Music", 9648: "Mystery", 10749: "Romance", 878: "Sci-Fi", 53: "Thriller", 10770: "TV Movie", 10752: "War", 37: "Western" };
        const GENRE_ID = Object.fromEntries(Object.entries(GENRES).map(([id, n]) => [n, +id]));

            return { path, query: Object.fromEntries(new URLSearchParams(qs || "")) };
        }
        function useRoute() {
            const [r, setR] = useState(parseHash);
            useEffect(() => { const f = () => setR(parseHash()); window.addEventListener("hashchange", f); return () => window.removeEventListener("hashchange", f); }, []);
            return r;
        }

        /* ============================= CONTEXTS ============================= */
        const ToastCtx = createContext({ show: () => { } });
        const useToast = () => useContext(ToastCtx);
        function ToastProvider({ children }) {
            const [t, setT] = useState(null); const timer = useRef(null);
            const show = useCallback((msg, icon) => { setT({ msg, icon, key: Date.now() }); clearTimeout(timer.current); timer.current = setTimeout(() => setT(null), 2800); }, []);

            useEffect(() => {
                try {
                    const flash = sessionStorage.getItem("cine.flash_toast");
                    if (flash) {
                        sessionStorage.removeItem("cine.flash_toast");
                        const parsed = JSON.parse(flash);
                        if (parsed && parsed.message) {
                            setTimeout(() => show(parsed.message, parsed.icon || "sparkles"), 250);
                        }
                    }
                } catch {}
            }, [show]);

            return <ToastCtx.Provider value={{ show }}>{children}
                {t && <div key={t.key} className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] fade-in">
                    <div className="flex items-center gap-2.5 rounded-full border border-white/10 bg-cine-elev/95 backdrop-blur px-5 py-3 shadow-2xl shadow-black/60">
                        <span className="text-cine-red"><Icon name={t.icon || "check"} size={16} /></span>
                        <span className="text-sm font-medium whitespace-nowrap">{t.msg}</span>
                    </div>
                </div>}
            </ToastCtx.Provider>;
        }

        /* ============================= AUTH CONTEXT & BACKEND API ============================= */
        const AUTH_KEY = "cine.auth.user.v1";
        const TOKEN_KEY = "cine.auth.token.v1";
        const API_BASE = "http://localhost:5000/api/auth";

        const AuthCtx = createContext();
        const useAuth = () => useContext(AuthCtx);

        function AuthProvider({ children }) {
            const toast = useToast();
            const [user, setUser] = useState(() => {
                try {
                    const saved = localStorage.getItem(AUTH_KEY);
                    if (!saved) return null;
                    const parsed = JSON.parse(saved);
                    if (parsed && parsed.badge) {
                        delete parsed.badge;
                        try { localStorage.setItem(AUTH_KEY, JSON.stringify(parsed)); } catch {}
                    }
                    return parsed;
                } catch { return null; }
            });
            const [token, setToken] = useState(() => {
                try { return localStorage.getItem(TOKEN_KEY) || null; } catch { return null; }
            });
            const [backendOnline, setBackendOnline] = useState(false);
            const [modal, setModal] = useState({ open: false, tab: "signin", email: "", previewUrl: null });

            // Check backend health
            useEffect(() => {
                let active = true;
                const checkHealth = async () => {
                    try {
                        const res = await fetch("http://localhost:5000/api/health", { method: "GET" });
                        if (res.ok && active) setBackendOnline(true);
                    } catch {
                        if (active) setBackendOnline(false);
                    }
                };
                checkHealth();
                const interval = setInterval(checkHealth, 15000);
                return () => { active = false; clearInterval(interval); };
            }, []);

            // Check token validity on boot
            useEffect(() => {
                if (token && backendOnline) {
                    fetch(`${API_BASE}/me`, {
                        headers: { Authorization: `Bearer ${token}` }
                    }).then(r => r.json()).then(data => {
                        if (data.success && data.user) {
                            setUser(u => ({ ...u, ...data.user }));
                        }
                    }).catch(() => {});
                }
            }, [token, backendOnline]);

            const openAuth = useCallback((tab = "signin", extra = {}) => {
                setModal(m => ({ ...m, open: true, tab, ...extra }));
            }, []);

            const closeAuth = useCallback(() => setModal(m => ({ ...m, open: false, email: "", reason: null, pendingMovie: null, previewUrl: null })), []);
            const clearPendingMovie = useCallback(() => setModal(m => ({ ...m, pendingMovie: null, reason: null })), []);

            // Real Registration (Sends OTP via Nodemailer & saves to MongoDB)
            const register = useCallback(async (name, email, password) => {
                try {
                    const res = await fetch(`${API_BASE}/register`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ name, email, password })
                    });
                    const data = await res.json();
                    if (!res.ok || !data.success) {
                        throw new Error(data.message || "Registration failed");
                    }
                    toast.show("Verification code sent to your email!", "mail");
                    setModal(m => ({ ...m, email: data.email, previewUrl: data.previewUrl }));
                    return { success: true, data };
                } catch (err) {
                    toast.show(err.message, "triangle-alert");
                    return { success: false, error: err.message };
                }
            }, [toast]);

            // Verify OTP
            const verifyOtp = useCallback(async (email, otp) => {
                try {
                    const res = await fetch(`${API_BASE}/verify-otp`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email, otp })
                    });
                    const data = await res.json();
                    if (!res.ok || !data.success) {
                        throw new Error(data.message || "Verification failed");
                    }
                    const loggedUser = { ...data.user, joined: "Nov 2026" };
                    setUser(loggedUser);
                    setToken(data.token);
                    try {
                        localStorage.setItem(AUTH_KEY, JSON.stringify(loggedUser));
                        localStorage.setItem(TOKEN_KEY, data.token);
                        sessionStorage.setItem("cine.flash_toast", JSON.stringify({ message: `Email verified! Welcome to CiNE, ${loggedUser.name}!`, icon: "sparkles" }));
                    } catch {}
                    closeAuth();
                    setTimeout(() => { window.location.reload(); }, 200);
                    return { success: true, data };
                } catch (err) {
                    toast.show(err.message, "triangle-alert");
                    return { success: false, error: err.message };
                }
            }, [toast, closeAuth]);

            // Resend OTP
            const resendOtp = useCallback(async (email) => {
                try {
                    const res = await fetch(`${API_BASE}/resend-otp`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email })
                    });
                    const data = await res.json();
                    if (!res.ok || !data.success) throw new Error(data.message || "Failed to resend code");
                    toast.show("New verification code sent!", "mail");
                    setModal(m => ({ ...m, previewUrl: data.previewUrl || m.previewUrl }));
                    return { success: true, data };
                } catch (err) {
                    toast.show(err.message, "triangle-alert");
                    return { success: false, error: err.message };
                }
            }, [toast]);

            // Real Login (MongoDB verification)
            const login = useCallback(async (email, password) => {
                try {
                    const res = await fetch(`${API_BASE}/login`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await res.json();
                    if (data.requireOtp) {
                        toast.show("Please enter verification code sent to your email", "mail");
                        return { success: false, requireOtp: true, email: data.email, previewUrl: data.previewUrl };
                    }
                    if (!res.ok || !data.success) {
                        throw new Error(data.message || "Invalid credentials");
                    }
                    const loggedUser = { ...data.user, joined: "Nov 2026" };
                    setUser(loggedUser);
                    setToken(data.token);
                    try {
                        localStorage.setItem(AUTH_KEY, JSON.stringify(loggedUser));
                        localStorage.setItem(TOKEN_KEY, data.token);
                        sessionStorage.setItem("cine.flash_toast", JSON.stringify({ message: `Welcome back, ${loggedUser.name}!`, icon: "sparkles" }));
                    } catch {}
                    closeAuth();
                    setTimeout(() => { window.location.reload(); }, 200);
                    return { success: true, data };
                } catch (err) {
                    toast.show(err.message, "triangle-alert");
                    return { success: false, error: err.message };
                }
            }, [toast, closeAuth]);

            // Forgot Password
            const forgotPassword = useCallback(async (email) => {
                try {
                    const res = await fetch(`${API_BASE}/forgot-password`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email })
                    });
                    const data = await res.json();
                    if (!res.ok || !data.success) throw new Error(data.message || "Failed to send reset code");
                    toast.show("Password reset code sent to your email", "mail");
                    setModal({ open: true, tab: "reset", email, previewUrl: data.previewUrl });
                    return { success: true, data };
                } catch (err) {
                    toast.show(err.message, "triangle-alert");
                    return { success: false, error: err.message };
                }
            }, [toast]);

            // Reset Password
            const resetPassword = useCallback(async (email, otp, newPassword) => {
                try {
                    const res = await fetch(`${API_BASE}/reset-password`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email, otp, newPassword })
                    });
                    const data = await res.json();
                    if (!res.ok || !data.success) throw new Error(data.message || "Failed to reset password");
                    toast.show("Password reset! You can now sign in.", "check");
                    setModal({ open: true, tab: "signin", email });
                    return { success: true, data };
                } catch (err) {
                    toast.show(err.message, "triangle-alert");
                    return { success: false, error: err.message };
                }
            }, [toast]);

            // Social Login (Google / Gmail, Facebook, Twitter)
            const socialLogin = useCallback(async ({ provider, email, name, avatar, providerId }) => {
                try {
                    const res = await fetch(`${API_BASE}/social-login`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ provider, email, name, avatar, providerId })
                    });
                    const data = await res.json();
                    if (!res.ok || !data.success) {
                        throw new Error(data.message || `Failed to sign in with ${provider}`);
                    }
                    const badge = provider === "google" ? "Google Verified" : provider === "facebook" ? "Facebook Verified" : "X / Twitter Verified";
                    const loggedUser = { ...data.user, joined: "Nov 2026" };
                    setUser(loggedUser);
                    setToken(data.token);
                    try {
                        localStorage.setItem(AUTH_KEY, JSON.stringify(loggedUser));
                        localStorage.setItem(TOKEN_KEY, data.token);
                    } catch {}
                    toast.show(data.message || `Signed in with ${provider}!`, "sparkles");

                    return { success: true, data };
                } catch (err) {
                    toast.show(err.message, "triangle-alert");
                    return { success: false, error: err.message };

            }, [toast, closeAuth]);

            // Logout
            const logout = useCallback(() => {
                setUser(null);
                setToken(null);

                    localStorage.removeItem(AUTH_KEY);
                    localStorage.removeItem(TOKEN_KEY);
                    localStorage.removeItem("cine.watchlist.v1");
                    sessionStorage.setItem("cine.flash_toast", JSON.stringify({ message: "Signed out successfully", icon: "log-out" }));
                } catch {}

                    window.location.hash = "#/";

            }, []);

            const value = useMemo(() => ({
                user,
                token,
                isAuth: !!user,
                backendOnline,
                modal,
                openAuth,
                closeAuth,
                clearPendingMovie,
                login,
                register,
                verifyOtp,
                resendOtp,
                forgotPassword,
                resetPassword,
                socialLogin,

            return <AuthCtx.Provider value={value}>{children}</AuthCtx.Provider>;
        }

        const WLCtx = createContext();
        const useWatchlist = () => useContext(WLCtx);
        const WL_KEY = "cine.watchlist.v1";
        function WatchlistProvider({ children }) {
            const toast = useToast();
            const auth = useAuth();
            const [items, setItems] = useState(() => {
                try {
                    const v = JSON.parse(localStorage.getItem(WL_KEY));
                    return Array.isArray(v) ? v : [];
                } catch (e) { return []; }
            });

            // If user logs in with token, sync watchlist from MongoDB
            useEffect(() => {
                if (auth.token && auth.token !== "demo_token" && auth.backendOnline) {
                    fetch("http://localhost:5000/api/auth/watchlist", {
                        headers: { Authorization: `Bearer ${auth.token}` }
                    }).then(r => r.json()).then(data => {
                        if (data.success && Array.isArray(data.watchlist)) {
                            setItems(data.watchlist);
                            try { localStorage.setItem(WL_KEY, JSON.stringify(data.watchlist)); } catch {}
                        }
                    }).catch(() => {});
                }
            }, [auth.token, auth.backendOnline]);

            useEffect(() => {
                try { localStorage.setItem(WL_KEY, JSON.stringify(items)); } catch (e) { }
            }, [items]);

            // Clear watchlist on sign out
            useEffect(() => {
                if (!auth.isAuth) {
                    setItems([]);
                    try { localStorage.removeItem(WL_KEY); } catch {}
                }
            }, [auth.isAuth]);

            // Auto-add pending movie after successful sign in
            useEffect(() => {
                if (auth.isAuth && auth.modal && auth.modal.pendingMovie) {
                    const pm = auth.modal.pendingMovie;
                    if (auth.clearPendingMovie) auth.clearPendingMovie();
                    setItems(cur => {
                        if (cur.some(m => m.id === pm.id)) return cur;
                        const { similar, ...rest } = pm;
                        return [...cur, rest];
                    });
                    toast.show(`Added "${pm.title}" to your Watchlist!`, "bookmark");
                    if (auth.token && auth.token !== "demo_token" && auth.backendOnline) {
                        fetch("http://localhost:5000/api/auth/watchlist/toggle", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                Authorization: `Bearer ${auth.token}`
                            },
                            body: JSON.stringify({
                                id: pm.id,
                                title: pm.title,
                                year: pm.year,
                                rating: pm.rating,
                                poster: pm.poster,
                                backdrop: pm.backdrop
                            })
                        }).catch(() => {});
                    }
                }
            }, [auth.isAuth, auth.modal && auth.modal.pendingMovie, auth.token, auth.backendOnline, toast]);

            const has = useCallback(id => items.some(m => m.id === id), [items]);

            const toggle = useCallback(async movie => {
                if (!auth.isAuth) {
                    toast.show("Please sign in to save movies to your Watchlist", "bookmark");
                    auth.openAuth("signin", { reason: "watchlist", pendingMovie: movie });
                    return;
                }
                const ex = items.some(m => m.id === movie.id);
                if (ex) {
                    setItems(cur => cur.filter(m => m.id !== movie.id));
                    toast.show("Removed from watchlist", "trash-2");
                } else {
                    const { similar, ...rest } = movie;
                    setItems(cur => [...cur, rest]);
                    toast.show("Added to watchlist", "bookmark");
                }

                // If logged in, sync with MongoDB
                if (auth.token && auth.token !== "demo_token" && auth.backendOnline) {
                    try {
                        await fetch("http://localhost:5000/api/auth/watchlist/toggle", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                Authorization: `Bearer ${auth.token}`
                            },
                            body: JSON.stringify({
                                id: movie.id,
                                title: movie.title,
                                year: movie.year,
                                rating: movie.rating,
                                poster: movie.poster,
                                backdrop: movie.backdrop
                            })

            }, [items, toast, auth]);

            const remove = useCallback(async id => {
                if (!auth.isAuth) {
                    toast.show("Please sign in to manage your Watchlist", "bookmark");
                    auth.openAuth("signin", { reason: "watchlist" });

                setItems(cur => cur.filter(m => m.id !== id));
                toast.show("Removed from watchlist", "trash-2");
                if (auth.token && auth.token !== "demo_token" && auth.backendOnline) {
                    try {
                        await fetch("http://localhost:5000/api/auth/watchlist/toggle", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                Authorization: `Bearer ${auth.token}`
                            },
                            body: JSON.stringify({ id })
                        });
                    } catch {}
                }
            }, [toast, auth]);

            const value = useMemo(() => ({ items, has, toggle, remove }), [items, has, toggle, remove]);
            return <WLCtx.Provider value={value}>{children}</WLCtx.Provider>;
        }

        /* ============================= ICON ============================= */
        const BRAND_ICONS = {
            Instagram: [
                ["rect", { width: "20", height: "20", x: "2", y: "2", rx: "5", ry: "5" }],
                ["path", { d: "M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" }],
                ["line", { x1: "17.5", x2: "17.51", y1: "6.5", y2: "6.5" }]
            ],
            Youtube: [
                ["path", { d: "M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17" }],
                ["polygon", { points: "10 15 15 12 10 9" }]
            ],
            Github: [
                ["path", { d: "M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" }],
                ["path", { d: "M9 18c-4.51 2-5-2-7-2" }]
            ]
        };
        function getIconNode(pascal) {
            if (BRAND_ICONS[pascal]) return BRAND_ICONS[pascal];
            const L = window.lucide; if (!L) return null;
            let v = (L.icons && L.icons[pascal]) || L[pascal];
            if (!v) return null;
            if (Array.isArray(v)) return v;
            if (v.iconNode) return v.iconNode;
            return null;
        }
        function Icon({ name, size = 18, className = "", strokeWidth = 2, filled = false }) {
            const pascal = name.split("-").map(s => s.charAt(0).toUpperCase() + s.slice(1)).join("");
            const node = getIconNode(pascal);
            if (!node) return null;
            const body = node.map(([tag, attrs]) => { const a = Object.entries(attrs || {}).filter(([k]) => k !== "key").map(([k, v]) => `${k}="${String(v).replace(/"/g, "&quot;")}"`).join(" "); return `<${tag} ${a}></${tag}>`; }).join("");
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="${filled ? "currentColor" : "none"}" stroke="currentColor" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round" class="${className}">${body}</svg>`;
            return <span className="inline-flex shrink-0" dangerouslySetInnerHTML={{ __html: svg }} />;
        }

        /* ============================= IMAGERY ============================= */
        const PALETTES = [["#1c130f", "#3d2417"], ["#0e1a1e", "#16333c"], ["#191121", "#341f4a"], ["#1f1113", "#4a1d24"], ["#0f1a13", "#1c3d2a"], ["#131320", "#26264a"]];
        function FallbackArt({ title, year, seed, wide }) {
            const p = PALETTES[Math.abs(seed || 0) % PALETTES.length];
            return <div className="absolute inset-0 flex items-center justify-center" style={{ background: `linear-gradient(150deg,${p[0]} 0%,${p[1]} 55%,#070808 100%)` }}>
                <div className="absolute inset-0 opacity-[0.12]" style={{ backgroundImage: "radial-gradient(circle at 28% 18%, #ffffff, transparent 46%)" }} />
                <span className="absolute font-display font-extrabold text-white/[0.05] select-none leading-none" style={{ fontSize: wide ? 200 : 130 }}>{(title || "C").charAt(0)}</span>
                <div className="relative text-center px-4">
                    <div className="mx-auto mb-2.5 w-9 h-9 rounded-full border border-white/15 flex items-center justify-center text-white/50"><Icon name="film" size={15} /></div>
                    <p className={"font-display font-bold uppercase tracking-wider text-white/80 leading-snug " + (wide ? "text-lg" : "text-[11px]")}>{title}</p>
                    {year && <p className="text-[10px] tracking-[0.3em] text-white/35 mt-1">{year}</p>}

        }
        function SmartImg({ src, fallbackSrc, title, year, seed, wide, className, imgClass }) {
            const [stage, setStage] = useState(src ? 0 : (fallbackSrc ? 1 : 2));
            useEffect(() => { setStage(src ? 0 : (fallbackSrc ? 1 : 2)); }, [src]);
            const current = stage === 0 ? src : (stage === 1 ? fallbackSrc : null);
            return <div className={"relative overflow-hidden bg-cine-surface " + (className || "")}>
                {(!current || stage === 2) ? <FallbackArt title={title} year={year} seed={seed} wide={wide} />
                    : <div className="absolute inset-0 shimmer bg-cine-elev" />}
                {current && stage !== 2 && <img key={current} src={current} alt={title || ""}
                    onError={() => setStage(s => s === 0 ? (fallbackSrc ? 1 : 2) : 2)}
                    className={"absolute inset-0 w-full h-full object-cover " + (imgClass || "")} />}
            </div>;
        }

        /* ============================= SHARED UI ============================= */
        function Logo({ className }) {
            return <a href="#/" aria-label="CiNE home" className={"font-display font-extrabold tracking-tight text-xl select-none " + (className || "")}>CiNE<span className="text-cine-red">..</span></a>;
        }

        document.head.insertAdjacentHTML("beforeend", "<style>@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.1)}}.kenburns{animation:kb 10s ease-out both}</style>");

        const trailerUrl = m => m.trailer
            ? `https://www.youtube.com/watch?v=${m.trailer}`
            : `https://www.youtube.com/results?search_query=${encodeURIComponent((m.title || "") + " " + (m.year || "") + " official trailer")}`;

        function Rating({ value, className, starSize = 13 }) {
            if (value == null || isNaN(value)) return null;
            return <span className={"inline-flex items-center gap-1 text-sm font-semibold " + (className || "")}>
                <Icon name="star" size={starSize} filled className="text-cine-red" />
                <span>{Number(value).toFixed(1)}</span>
            </span>;
        }

        function Reveal({ children, delay = 0, className }) {
            const ref = useRef(null); const [vis, setVis] = useState(false);
            useEffect(() => {
                const el = ref.current; if (!el) return;
                const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setVis(true); io.disconnect(); } }, { threshold: 0.1 });
                io.observe(el); return () => io.disconnect();
            }, []);
            return <div ref={ref} style={{ transitionDelay: delay + "ms" }}
                className={(className || "") + " transition-all duration-700 ease-out " + (vis ? "opacity-100 translate-y-0" : "opacity-0 translate-y-7")}>{children}</div>;

        function Pill({ active, children, onClick }) {

                    (active ? "bg-cine-red border-cine-red text-white shadow-[0_6px_20px_-6px_rgba(229,36,42,0.6)]"
                        : "border-white/10 text-cine-muted hover:text-white hover:border-white/25 bg-white/[0.02]")}>{children}</button>;
        }

        /* ============================= MOVIE CARDS ============================= */

        const CardBackground = ({ activeView }) => (

        const RegisterForm = ({ activeView, onSuccess, onSwitchToLogin }) => {
            const { register, verifyOtp, resendOtp, modal } = useAuth();
            const [name, setName] = useState("");
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [showPass, setShowPass] = useState(false);
            const [otp, setOtp] = useState("");
            const [showOtp, setShowOtp] = useState(false);
            const [loading, setLoading] = useState(false);
            const [err, setErr] = useState("");
            const [previewUrl, setPreviewUrl] = useState(null);
            const [timer, setTimer] = useState(45);

            useEffect(() => {
                if (modal.tab === "otp" && modal.email) {
                    setEmail(modal.email);
                    setShowOtp(true);
                }
            }, [modal.tab, modal.email]);

            useEffect(() => {
                let interval;
                if (showOtp && timer > 0) {
                    interval = setInterval(() => setTimer(t => t - 1), 1000);
                }
                return () => clearInterval(interval);
            }, [showOtp, timer]);

            const handleSubmit = async e => {
                e.preventDefault();
                setErr("");
                if (!name.trim() || !email.trim() || !password) {
                    setErr("All fields are required");
                    return;
                }
                if (password.length < 6) {
                    setErr("Password must be at least 6 characters");
                    return;
                }
                setLoading(true);
                const res = await register(name.trim(), email.trim(), password);
                setLoading(false);
                if (res.success) {
                    setShowOtp(true);
                    setTimer(45);
                    setPreviewUrl(res.data?.previewUrl || null);
                } else if (res.error) {
                    setErr(res.error);
                }
            };

            const handleVerify = async e => {
                e.preventDefault();
                setErr("");
                if (!otp.trim() || otp.trim().length < 6) { setErr("Enter 6-digit code"); return; }
                setLoading(true);
                const res = await verifyOtp(email, otp.trim());
                setLoading(false);
                if (res.success) {
                    if (onSuccess) onSuccess();
                } else if (res.error) {
                    setErr(res.error);
                }
            };

            const handleResend = async () => {
                if (timer > 0) return;
                setErr("");
                const res = await resendOtp(email);
                if (res.success) {
                    setTimer(45);
                    if (res.data?.previewUrl) setPreviewUrl(res.data.previewUrl);
                }
            };

            return (
                <div className={`form register ${activeView === "register" ? "active" : ""}`}>

                                <Icon name="mail" size={12} /> Open Test Email Preview ↗

                        </div>

                    {showOtp ? (
                        <form onSubmit={handleVerify}>
                            <div className="auth-input-wrapper">
                                <input
                                    type="text"
                                    maxLength={6}
                                    value={otp}
                                    onChange={e => setOtp(e.target.value.replace(/\D/g, ""))}
                                    placeholder="000000"
                                    className="auth-otp-input"
                                    required
                                    autoFocus
                                />
                            </div>

                            <button type="submit" className="auth-btn-primary" disabled={loading}>
                                {loading ? (
                                    <><span className="auth-spinner" /> VERIFYING...</>
                                ) : (
                                    <><span>CONFIRM CODE</span> <Icon name="check" size={15} /></>
                                )}
                            </button>

                            <div className="otp-footer">
                                {timer > 0 ? (
                                    <span className="otp-timer">Resend code in {timer}s</span>
                                ) : (
                                    <button type="button" onClick={handleResend} className="otp-resend-btn">
                                        Resend code
                                    </button>
                                )}
                                <button type="button" onClick={() => { setShowOtp(false); setErr(""); }} className="otp-back-btn">
                                    ← Edit details
                                </button>
                            </div>
                        </form>
                    ) : (
                        <form onSubmit={handleSubmit}>
                            <div className="auth-input-wrapper">
                                <span className="auth-input-icon"><Icon name="user" size={15} /></span>
                                <input
                                    type="text"
                                    placeholder="Full name"
                                    value={name}
                                    onChange={e => setName(e.target.value)}
                                    className="auth-input"
                                    required
                                />
                            </div>

                            <div className="auth-input-wrapper">
                                <span className="auth-input-icon"><Icon name="mail" size={15} /></span>
                                <input
                                    type="email"
                                    placeholder="Email address"
                                    value={email}
                                    onChange={e => setEmail(e.target.value)}
                                    className="auth-input"
                                    required
                                />
                            </div>

                            <div className="auth-input-wrapper">
                                <span className="auth-input-icon"><Icon name="lock" size={15} /></span>
                                <input
                                    type={showPass ? "text" : "password"}
                                    placeholder="Password (min 6 characters)"
                                    value={password}
                                    onChange={e => setPassword(e.target.value)}
                                    className="auth-input"
                                    required
                                />
                                <button
                                    type="button"
                                    onClick={() => setShowPass(v => !v)}
                                    className="auth-pass-toggle"
                                    aria-label="Toggle password visibility">
                                    <Icon name={showPass ? "eye-off" : "eye"} size={15} />
                                </button>
                            </div>

                            <button type="submit" className="auth-btn-primary" disabled={loading}>
                                {loading ? (
                                    <><span className="auth-spinner" /> CREATING ACCOUNT...</>
                                ) : (
                                    <><span>SIGN UP</span> <Icon name="arrow-right" size={15} /></>
                                )}
                            </button>

                            <div className="mobile-switch-link sm:hidden mt-3 text-center">
                                <span className="text-white/50 text-xs">Already have an account? </span>
                                <button type="button" onClick={onSwitchToLogin} className="text-cine-red text-xs font-bold underline bg-transparent border-0 p-0 cursor-pointer">
                                    Log In
                                </button>
                            </div>
                        </form>
                    )}
                </div>
            );
        };

        const LoginForm = ({ activeView, onSuccess, onSwitchToRegister }) => {
            const { login, verifyOtp, resendOtp, forgotPassword, resetPassword, modal } = useAuth();
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [showPass, setShowPass] = useState(false);
            const [mode, setMode] = useState("login"); // "login" | "otp" | "forgot" | "reset"
            const [otp, setOtp] = useState("");
            const [newPassword, setNewPassword] = useState("");
            const [showNewPass, setShowNewPass] = useState(false);
            const [rememberMe, setRememberMe] = useState(true);
            const [loading, setLoading] = useState(false);
            const [err, setErr] = useState("");
            const [previewUrl, setPreviewUrl] = useState(null);
            const [timer, setTimer] = useState(45);

            useEffect(() => {
                let interval;
                if ((mode === "otp" || mode === "reset") && timer > 0) {
                    interval = setInterval(() => setTimer(t => t - 1), 1000);
                }
                return () => clearInterval(interval);
            }, [mode, timer]);

            const handleSubmit = async e => {
                e.preventDefault();
                setErr("");
                if (!email.trim() || !password) {
                    setErr("Email and password are required");
                    return;
                }
                setLoading(true);
                const res = await login(email.trim(), password);
                setLoading(false);
                if (res.success) {
                    if (onSuccess) onSuccess();
                } else if (res.requireOtp) {
                    setMode("otp");
                    setTimer(45);
                    if (res.email) setEmail(res.email);
                    setPreviewUrl(res.previewUrl || null);
                    setErr("Your account is not verified yet. Enter the 6-digit code sent to your email.");
                } else if (res.error) {
                    setErr(res.error);
                }
            };

            const handleVerifyOtp = async e => {
                e.preventDefault();
                setErr("");
                if (!otp.trim() || otp.trim().length < 6) { setErr("Enter 6-digit verification code"); return; }
                setLoading(true);
                const res = await verifyOtp(email, otp.trim());
                setLoading(false);
                if (res.success) {
                    if (onSuccess) onSuccess();
                } else if (res.error) {
                    setErr(res.error);
                }
            };

            const handleForgot = async e => {
                e.preventDefault();
                setErr("");
                if (!email.trim()) { setErr("Enter your email address"); return; }
                setLoading(true);
                const res = await forgotPassword(email.trim());
                setLoading(false);
                if (res.success) {
                    setMode("reset");
                    setTimer(45);
                    setPreviewUrl(res.data?.previewUrl || null);
                } else if (res.error) setErr(res.error);
            };

            const handleReset = async e => {
                e.preventDefault();
                setErr("");
                if (!otp.trim() || otp.trim().length < 6) { setErr("Enter 6-digit reset code"); return; }
                if (newPassword.length < 6) { setErr("Password must be at least 6 characters"); return; }
                setLoading(true);
                const res = await resetPassword(email.trim(), otp.trim(), newPassword);
                setLoading(false);
                if (res.success) {
                    setMode("login");
                    setPassword("");
                } else if (res.error) setErr(res.error);
            };

            const handleResend = async () => {
                if (timer > 0) return;
                setErr("");
                const res = mode === "otp" ? await resendOtp(email) : await forgotPassword(email);
                if (res.success) {
                    setTimer(45);
                    if (res.data?.previewUrl) setPreviewUrl(res.data.previewUrl);
                }
            };

            return (
                <div className={`form login ${activeView === "login" ? "active" : ""}`}>
                    {modal.reason === "watchlist" && (
                        <div className="watchlist-pop-badge">
                            <div className="w-7 h-7 rounded-full bg-cine-red/20 border border-cine-red/50 flex items-center justify-center text-cine-red shrink-0">
                                <Icon name="bookmark" size={14} />
                            </div>
                            <div className="flex-1 text-left">
                                <p className="font-bold text-xs text-white leading-tight">Watchlist Sign-In Required</p>

                            </div>
                        </div>
                    )}

                    <h2>{mode === "login" ? "Sign In" : (mode === "otp" ? "Verify Email" : (mode === "forgot" ? "Reset Password" : "New Password"))}</h2>
                    <p>
                        {mode === "login" && "Enter your credentials to access your account"}
                        {mode === "otp" && `Enter the 6-digit code sent to ${email}`}
                        {mode === "forgot" && "We will send a 6-digit verification code to your email"}
                        {mode === "reset" && "Enter the verification code and set your new password"}
                    </p>

                    {err && (
                        <div className="auth-alert-err">
                            <Icon name="alert-circle" size={14} className="shrink-0 text-cine-red" />
                            <span>{err}</span>
                        </div>
                    )}

                    {previewUrl && (
                        <div className="w-full mb-3 px-2 py-1 text-center">
                            <a href={previewUrl} target="_blank" rel="noopener noreferrer" className="text-[11px] text-cine-red hover:underline font-semibold inline-flex items-center gap-1">
                                <Icon name="mail" size={12} /> Open Test Email Preview ↗
                            </a>
                        </div>
                    )}

                    {mode === "login" && (
                        <form onSubmit={handleSubmit}>
                            <div className="auth-input-wrapper">
                                <span className="auth-input-icon"><Icon name="mail" size={15} /></span>
                                <input
                                    type="email"
                                    placeholder="Email address"
                                    value={email}
                                    onChange={e => setEmail(e.target.value)}
                                    className="auth-input"
                                    required
                                />
                            </div>

                            <div className="auth-input-wrapper">
                                <span className="auth-input-icon"><Icon name="lock" size={15} /></span>
                                <input
                                    type={showPass ? "text" : "password"}
                                    placeholder="Password"
                                    value={password}
                                    onChange={e => setPassword(e.target.value)}
                                    className="auth-input"
                                    required
                                />
                                <button
                                    type="button"
                                    onClick={() => setShowPass(v => !v)}
                                    className="auth-pass-toggle"
                                    aria-label="Toggle password visibility">
                                    <Icon name={showPass ? "eye-off" : "eye"} size={15} />
                                </button>
                            </div>

                            <div className="auth-remember-row">
                                <label className="auth-checkbox-label">
                                    <input
                                        type="checkbox"
                                        checked={rememberMe}
                                        onChange={e => setRememberMe(e.target.checked)}
                                        className="auth-checkbox"
                                    />
                                    <span>Remember me</span>
                                </label>
                                <button
                                    type="button"
                                    onClick={() => { setMode("forgot"); setErr(""); }}
                                    className="auth-forgot-link">
                                    Forgot password?
                                </button>
                            </div>

                            <button type="submit" className="auth-btn-primary" disabled={loading}>
                                {loading ? (
                                    <><span className="auth-spinner" /> SIGNING IN...</>
                                ) : (
                                    <><span>SIGN IN</span> <Icon name="arrow-right" size={15} /></>
                                )}
                            </button>

                            <div className="mobile-switch-link sm:hidden mt-3 text-center">
                                <span className="text-white/50 text-xs">Don't have an account? </span>
                                <button type="button" onClick={onSwitchToRegister} className="text-cine-red text-xs font-bold underline bg-transparent border-0 p-0 cursor-pointer">
                                    Sign Up
                                </button>
                            </div>
                        </form>
                    )}

                    {mode === "otp" && (
                        <form onSubmit={handleVerifyOtp}>
                            <div className="auth-input-wrapper">
                                <input
                                    type="text"
                                    maxLength={6}
                                    value={otp}
                                    onChange={e => setOtp(e.target.value.replace(/\D/g, ""))}
                                    placeholder="000000"
                                    className="auth-otp-input"
                                    required
                                    autoFocus
                                />
                            </div>

                            <button type="submit" className="auth-btn-primary" disabled={loading}>
                                {loading ? (
                                    <><span className="auth-spinner" /> VERIFYING...</>
                                ) : (
                                    <><span>CONFIRM CODE</span> <Icon name="check" size={15} /></>
                                )}
                            </button>

                            <div className="otp-footer">
                                {timer > 0 ? (
                                    <span className="otp-timer">Resend code in {timer}s</span>
                                ) : (
                                    <button type="button" onClick={handleResend} className="otp-resend-btn">
                                        Resend code
                                    </button>
                                )}
                                <button type="button" onClick={() => { setMode("login"); setErr(""); }} className="otp-back-btn">
                                    ← Back to login
                                </button>
                            </div>
                        </form>
                    )}

                    {mode === "forgot" && (
                        <form onSubmit={handleForgot}>
                            <div className="auth-input-wrapper">
                                <span className="auth-input-icon"><Icon name="mail" size={15} /></span>
                                <input
                                    type="email"
                                    placeholder="Registered email address"
                                    value={email}
                                    onChange={e => setEmail(e.target.value)}
                                    className="auth-input"
                                    required
                                    autoFocus
                                />
                            </div>

                            <button type="submit" className="auth-btn-primary" disabled={loading}>
                                {loading ? (
                                    <><span className="auth-spinner" /> SENDING CODE...</>
                                ) : (
                                    <><span>SEND RESET CODE</span> <Icon name="mail" size={15} /></>
                                )}
                            </button>

                            <div className="mt-3 text-center">
                                <button type="button" onClick={() => { setMode("login"); setErr(""); }} className="otp-back-btn">
                                    ← Back to login
                                </button>
                            </div>
                        </form>
                    )}

                    {mode === "reset" && (
                        <form onSubmit={handleReset}>
                            <div className="auth-input-wrapper">
                                <input
                                    type="text"
                                    maxLength={6}
                                    value={otp}
                                    onChange={e => setOtp(e.target.value.replace(/\D/g, ""))}
                                    placeholder="6-digit reset code"
                                    className="auth-otp-input"
                                    required
                                    autoFocus
                                />

                            <div className="auth-input-wrapper">
                                <span className="auth-input-icon"><Icon name="lock" size={15} /></span>
                                <input
                                    type={showNewPass ? "text" : "password"}
                                    placeholder="New password (min 6 characters)"
                                    value={newPassword}
                                    onChange={e => setNewPassword(e.target.value)}
                                    className="auth-input"
                                    required
                                />
                                <button
                                    type="button"
                                    onClick={() => setShowNewPass(v => !v)}
                                    className="auth-pass-toggle"
                                    aria-label="Toggle password visibility">
                                    <Icon name={showNewPass ? "eye-off" : "eye"} size={15} />
                                </button>
                            </div>

                            <button type="submit" className="auth-btn-primary" disabled={loading}>
                                {loading ? (
                                    <><span className="auth-spinner" /> UPDATING PASSWORD...</>

                                    <><span>UPDATE PASSWORD</span> <Icon name="check" size={15} /></>
                                )}
                            </button>

                            <div className="mt-3 text-center">
                                <button type="button" onClick={() => { setMode("login"); setErr(""); }} className="otp-back-btn">
                                    ← Back to login
                                </button>

        const Login = ({ onClose }) => {
            const { modal, backendOnline } = useAuth();

            useEffect(() => {
                if (modal.tab === "signup") {
                    setActiveView("register");

                    setActiveView("login");

            const toggleView = () => {
                setActiveView(activeView === "login" ? "register" : "login");

            return (
                <div className="card">

                    )}

                            onClick={() => setActiveView("login")}
                            className={`mobile-auth-tab ${activeView === "login" ? "active" : ""}`}>
                            Sign In
                        </button>
                        <button
                            type="button"
                            onClick={() => setActiveView("register")}
                            className={`mobile-auth-tab ${activeView === "register" ? "active" : ""}`}>
                            Create Account
                        </button>
                    </div>

                        onSuccess={onClose}

                    <HeroPanel

                        title="Hello There"

                        activeView={activeView}

        function AuthModal() {
            const { modal, closeAuth } = useAuth();

            useEffect(() => {
                if (modal.open && modal.reason === "watchlist") {
                    setPopupMsg("Sign in or create an account to access your Watchlist");
                    const t = setTimeout(() => setPopupMsg(null), 4500);
                    return () => clearTimeout(t);
                } else {
                    setPopupMsg(null);
                }
            }, [modal.open, modal.reason]);

            if (!modal.open) return null;
            return (
                <div className="fixed inset-0 z-[120] flex items-center justify-center p-4 bg-black/85 backdrop-blur-md fade-in"
                    onClick={e => { if (e.target === e.currentTarget) closeAuth(); }}>
                    {popupMsg && (
                        <div className="fixed top-6 left-1/2 -translate-x-1/2 z-[130] flex items-center gap-2.5 px-4 py-2.5 rounded-full bg-cine-elev/95 border border-cine-red/50 text-white text-xs font-semibold shadow-2xl shadow-cine-red/30 backdrop-blur-xl fade-in">
                            <Icon name="bookmark" size={15} className="text-cine-red shrink-0" />
                            <span>{popupMsg}</span>
                            <button type="button" onClick={() => setPopupMsg(null)} className="ml-2 text-white/50 hover:text-white bg-transparent border-0 cursor-pointer p-0 inline-flex items-center">
                                <Icon name="x" size={13} />
                            </button>
                        </div>

                    <Login onClose={closeAuth} />
                </div>

        /* ============================= NAVBAR ============================= */
        function Navbar({ route }) {
            const toast = useToast();
            const auth = useAuth();
            const wl = useWatchlist();
            const [scrolled, setScrolled] = useState(false);
            const [open, setOpen] = useState(false);
            const [profileOpen, setProfileOpen] = useState(false);
            const profileRef = useRef(null);
            const [q, setQ] = useState("");
            const [results, setResults] = useState(null);
            const [searching, setSearching] = useState(false);
            const [drop, setDrop] = useState(false);
            const boxRef = useRef(null);
            useEffect(() => {
                const f = () => setScrolled(window.scrollY > 20); f();
                window.addEventListener("scroll", f, { passive: true }); return () => window.removeEventListener("scroll", f);
            }, []);
            useEffect(() => { setOpen(false); setDrop(false); setProfileOpen(false); }, [route.path, route.query && route.query.q]);
            useEffect(() => {
                const f = e => {
                    if (boxRef.current && !boxRef.current.contains(e.target)) setDrop(false);
                    if (profileRef.current && !profileRef.current.contains(e.target)) setProfileOpen(false);
                };
                document.addEventListener("mousedown", f); return () => document.removeEventListener("mousedown", f);
            }, []);
            useEffect(() => {
                if (!q.trim()) { setResults(null); setSearching(false); return; }
                setSearching(true);

                    try { const r = await DataService.explore({ query: q.trim(), genre: "All", sort: "popularity" }); setResults(r.slice(0, 6)); }
                    catch (e) { setResults([]); }
                    setSearching(false);

                        <NavLink to="/">Discover</NavLink>

                    </nav>
                    <div className="flex-1" />
                    <div ref={boxRef} className="relative hidden lg:block w-72">
                        <form onSubmit={submit}>
                            <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-cine-muted"><Icon name="search" size={15} /></span>
                            <input value={q} onChange={e => { setQ(e.target.value); setDrop(true); }} onFocus={() => setDrop(true)}
                                placeholder="Search movies, shows, people..."
                                className="w-full bg-white/[0.05] border border-white/10 rounded-full pl-10 pr-4 py-2.5 text-sm placeholder:text-cine-muted/70 outline-none focus:border-cine-red/50 focus:bg-white/[0.07] transition-all" />
                        </form>
                        {drop && q.trim() && <div className="absolute right-0 top-12 w-[22rem] rounded-xl border border-white/10 bg-cine-elev/95 backdrop-blur-xl shadow-2xl shadow-black/70 overflow-hidden fade-in">
                            {searching && <div className="p-3 space-y-2">{[0, 1, 2].map(i => <Skel key={i} className="h-12" />)}</div>}
                            {!searching && results && results.length === 0 && <p className="p-4 text-sm text-cine-muted">No results for “{q.trim()}”.</p>}
                            {!searching && results && results.map(m =>
                                <a key={m.id} href={"#/movie/" + m.id} onClick={() => setDrop(false)} className="flex items-center gap-3 px-3 py-2.5 hover:bg-white/[0.05] transition-colors">
                                    <div className="w-9 h-[52px] rounded-md overflow-hidden shrink-0 border border-white/10 relative">
                                        <SmartImg src={IMG_POSTER(m.poster)} fallbackSrc={IMG_DIRECT_POSTER(m.poster)} title={m.title} seed={m.id} className="h-full w-full" />
                                    </div>
                                    <div className="min-w-0 flex-1">
                                        <p className="text-sm font-semibold truncate">{m.title}</p>
                                        <p className="text-xs text-cine-muted flex items-center gap-2 mt-0.5">{m.year || "—"} <Rating value={m.rating} starSize={10} className="text-[11px]" /></p>
                                    </div>
                                </a>)}
                            {!searching && results && results.length > 0 &&
                                <button onClick={submit} className="w-full px-4 py-3 text-xs font-semibold text-cine-muted hover:text-white hover:bg-white/[0.05] transition-colors text-left border-t border-white/[0.06]">
                                    See all results for “{q.trim()}” →</button>}
                        </div>}
                    </div>
                    <button aria-label="Notifications" onClick={() => toast.show("You're all caught up", "bell")}
