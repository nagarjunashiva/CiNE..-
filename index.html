                        <Icon name="bell" size={16} />
                    </button>
                    {auth.isAuth ? (
                        <div ref={profileRef} className="relative">
                            <button aria-label="Account menu" onClick={() => setProfileOpen(v => !v)}
                                className="w-9 h-9 rounded-full bg-gradient-to-br from-cine-red to-[#7a1a6b] flex items-center justify-center text-white ring-2 ring-white/10 hover:ring-cine-red/60 transition-all font-display font-bold text-xs active:scale-95">
                                {auth.user.name.charAt(0).toUpperCase()}
                            </button>
                            {profileOpen && (
                                <div className="absolute right-0 top-12 w-64 rounded-2xl border border-white/10 bg-cine-elev/98 backdrop-blur-xl shadow-2xl shadow-black/80 p-3 fade-in z-50">
                                    <div className="px-3 py-2.5 border-b border-white/[0.08] mb-2">
                                        <p className="font-semibold text-sm truncate text-white">{auth.user.name}</p>
                                        <p className="text-xs text-cine-muted truncate">{auth.user.email}</p>
                                        
                                    </div>
                                    <a href="#/watchlist" onClick={() => setProfileOpen(false)}
                                        className="flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold text-cine-muted hover:text-white hover:bg-white/[0.05] transition-all">
                                        <span className="flex items-center gap-2.5"><Icon name="bookmark" size={14} className="text-cine-red" /> My Watchlist</span>
                                        <span className="text-[11px] text-white/50">{wl.items.length}</span>
                                    </a>
                                    <button onClick={() => { auth.logout(); setProfileOpen(false); }}
                                        className="w-full mt-1 flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold text-cine-red hover:bg-cine-red/10 transition-all text-left">
                                        <Icon name="log-out" size={14} /> Sign Out
                                    </button>
                                </div>
                            )}
                        </div>
                    ) : (
                        <button onClick={() => auth.openAuth("signin")}
                            className="rounded-full bg-cine-red hover:bg-[#f3353b] px-3.5 sm:px-4 py-2 text-xs font-bold text-white transition-all shadow-[0_4px_15px_-4px_rgba(229,36,42,0.6)] active:scale-95 flex items-center gap-1.5">
                            <Icon name="user" size={14} />
                            <span>Sign In</span>
                        </button>
                    )}
                    <button aria-label="Menu" onClick={() => setOpen(v => !v)}
                        className="md:hidden w-10 h-10 rounded-full border border-white/10 flex items-center justify-center text-white/85 hover:border-white/30 transition-all active:scale-90">
                        <Icon name={open ? "x" : "menu"} size={18} />
                    </button>
                </div>
                {open && <div className="md:hidden border-t border-white/[0.06] bg-cine-bg/95 backdrop-blur-xl fade-in">
                    <div className="px-5 py-5 space-y-1">
                        <form onSubmit={submit} className="relative mb-4">
                            <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-cine-muted"><Icon name="search" size={15} /></span>
                            <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search movies..."
                                className="w-full bg-white/[0.05] border border-white/10 rounded-full pl-10 pr-4 py-3 text-sm placeholder:text-cine-muted/70 outline-none focus:border-cine-red/50" />
                        </form>
                        {[["/", "Discover"], ["/explore", "Explore"], ["/watchlist", "Watchlist"]].map(([to, label]) => {
                            const active = to === "/" ? (route.path === "/" || route.path === "") : route.path.startsWith(to);

                                onClick={e => {
                                    if (to === "/watchlist" && !auth.isAuth) {
                                        e.preventDefault();
                                        setOpen(false);
                                        toast.show("Please sign in to access your Watchlist", "bookmark");
                                        auth.openAuth("signin", { reason: "watchlist" });
                                    }
                                }}
                                className={"flex items-center justify-between rounded-lg px-4 py-3.5 text-sm font-semibold transition-colors " + (active ? "bg-cine-red/10 text-white border border-cine-red/30" : "text-cine-muted hover:text-white hover:bg-white/[0.04] border border-transparent")}>
                                {label}{active && <span className="w-1.5 h-1.5 rounded-full bg-cine-red" />}

                        })}
                        {auth.isAuth ? (
                            <div className="pt-2 pb-1 border-t border-white/[0.06] mt-2">
                                <div className="px-4 py-2">
                                    <p className="text-sm font-semibold text-white">{auth.user.name}</p>
                                    <p className="text-xs text-cine-muted">{auth.user.email}</p>
                                </div>
                                <button onClick={() => { auth.logout(); setOpen(false); }}

                                </button>
                            </div>
                        ) : (
                            <div className="pt-2 border-t border-white/[0.06] mt-2">
                                <button onClick={() => { auth.openAuth("signin"); setOpen(false); }}
                                    className="w-full py-3 rounded-xl bg-cine-red text-white text-sm font-bold flex items-center justify-center gap-2 shadow-lg shadow-cine-red/30">
                                    <Icon name="user" size={16} /> Sign In / Register
                                </button>
                            </div>

                    </div>
                </div>}
            </header>;
        }

        /* ============================= HERO ============================= */
        function Hero() {
            const wl = useWatchlist();
            const [items, setItems] = useState(null);
            const [i, setI] = useState(0);
            const [paused, setPaused] = useState(false);
            useEffect(() => {
                let on = true;
                DataService.featured().then(r => {
                    if (on && r && r.length) setItems(r);
                    else if (on) SampleService.featured().then(setItems);
                }).catch(() => {
                    if (on) SampleService.featured().then(setItems);
                });
                return () => { on = false };
            }, []);
            useEffect(() => {
                if (!items || paused || items.length < 2) return;
                const t = setInterval(() => setI(v => (v + 1) % items.length), 8000); return () => clearInterval(t);
            }, [items, paused]);
            if (!items) return <section className="relative h-[600px] lg:h-[700px]"><div className="absolute inset-0 shimmer" /></section>;
            const m = items[i]; const on = wl.has(m.id);
            const go = d => setI(v => (v + d + items.length) % items.length);
            const titleText = m.displayTitle || m.title || "";
            const titleSize = titleText.length > 30
                ? "text-3xl sm:text-4xl lg:text-5xl"
                : titleText.length > 18
                    ? "text-4xl sm:text-5xl lg:text-6xl"
                    : "text-5xl sm:text-6xl lg:text-7xl";
            return <section className="relative min-h-[640px] sm:min-h-[660px] lg:min-h-[700px] flex items-center overflow-hidden"
                onMouseEnter={() => setPaused(true)} onMouseLeave={() => setPaused(false)}>
                {items.map((it, idx) =>
                    <div key={it.id} className={"absolute inset-0 transition-opacity duration-[1100ms] ease-out " + (idx === i ? "opacity-100" : "opacity-0 pointer-events-none")}>
                        <div className="absolute inset-0"><SmartImg src={IMG_BACKDROP(it.backdrop)} fallbackSrc={IMG_DIRECT_BACKDROP(it.backdrop) || PICSUM(it.id)} title={it.title} seed={it.id} wide className="h-full w-full" imgClass={idx === i ? "kenburns" : ""} /></div>
                    </div>)}
                <div className="absolute inset-0 bg-gradient-to-r from-cine-bg via-cine-bg/55 to-transparent" />
                <div className="absolute inset-0 bg-gradient-to-t from-cine-bg via-transparent to-black/40" />
                <div className="relative h-full max-w-7xl mx-auto px-5 lg:px-8 flex items-center w-full">
                    <div key={m.id} className="max-w-3xl pt-14 pb-8">
                        <p className="anim-hero text-[11px] font-bold tracking-[0.35em] text-cine-red mb-3.5">{m.label || "NOW TRENDING"}</p>
                        <a href={"#/movie/" + m.id} className="block group">
                            <h1 className={"anim-hero-d1 font-display font-extrabold uppercase leading-[1.02] tracking-tight drop-shadow-2xl group-hover:text-white/95 transition-colors line-clamp-3 " + titleSize}>
                                {titleText}
                            </h1>
                            {m.tagline && <p className="anim-hero-d1 font-serif italic text-cine-red text-2xl sm:text-3xl mt-1 drop-shadow">{m.tagline}</p>}
                        </a>
                        <div className="anim-hero-d2 mt-4 flex flex-wrap items-center gap-x-4 gap-y-2 text-sm text-white/80">
                            <Rating value={m.rating} className="text-sm" />
                            {m.year && <span>{m.year}</span>}
                            {m.runtime && <span>{fmtRuntime(m.runtime)}</span>}
                            {movieGenres(m).length > 0 && <span className="text-white/60">{movieGenres(m).slice(0, 2).join(" · ")}</span>}
                        </div>
                        {m.overview && <p className="anim-hero-d2 mt-3.5 text-sm sm:text-[15px] leading-relaxed text-white/70 max-w-xl line-clamp-2 sm:line-clamp-3">{m.overview}</p>}
                        <div className="anim-hero-d3 mt-6 flex flex-wrap items-center gap-3">
                            <a href={trailerUrl(m)} target="_blank" rel="noopener"
                                className="inline-flex items-center gap-2.5 rounded-lg bg-cine-red px-6 py-3.5 text-sm font-bold text-white shadow-[0_12px_35px_-8px_rgba(229,36,42,0.65)] hover:bg-[#f3353b] hover:shadow-[0_16px_40px_-8px_rgba(229,36,42,0.8)] transition-all duration-300 active:scale-95">
                                <Icon name="play" size={16} filled /> Watch Trailer
                            </a>
                            <button onClick={() => wl.toggle(m)}
                                className={"inline-flex items-center gap-2.5 rounded-lg px-6 py-3.5 text-sm font-semibold border backdrop-blur-md transition-all duration-300 active:scale-95 " +
                                    (on ? "border-cine-red/60 bg-cine-red/10 text-white" : "border-white/20 bg-white/[0.06] text-white hover:border-white/45 hover:bg-white/[0.1]")}>
                                <Icon name={on ? "check" : "plus"} size={16} /> {on ? "In Watchlist" : "Add to Watchlist"}
                            </button>
                        </div>
                    </div>
                </div>
                {items.length > 1 && <React.Fragment>
                    <button aria-label="Previous" onClick={() => go(-1)}
                        className="absolute left-3 lg:left-6 top-1/2 -translate-y-1/2 z-10 w-11 h-11 rounded-full border border-white/15 bg-black/35 backdrop-blur-md flex items-center justify-center text-white/80 hover:bg-cine-red hover:border-cine-red hover:text-white transition-all duration-300 active:scale-90">
                        <Icon name="chevron-left" size={20} />
                    </button>
                    <button aria-label="Next" onClick={() => go(1)}
                        className="absolute right-3 lg:right-6 top-1/2 -translate-y-1/2 z-10 w-11 h-11 rounded-full border border-white/15 bg-black/35 backdrop-blur-md flex items-center justify-center text-white/80 hover:bg-cine-red hover:border-cine-red hover:text-white transition-all duration-300 active:scale-90">
                        <Icon name="chevron-right" size={20} />
                    </button>
                    <div className="absolute bottom-7 left-5 lg:left-8 z-10 flex items-center gap-1.5 max-w-7xl">
                        {items.map((_, idx) =>
                            <button key={idx} aria-label={"Slide " + (idx + 1)} onClick={() => setI(idx)}
                                className={"h-1.5 rounded-full transition-all duration-500 " + (idx === i ? "w-6 bg-cine-red" : "w-1.5 bg-white/30 hover:bg-white/60")} />)}
                    </div>
                </React.Fragment>}
            </section>;
        }

        /* ============================= DISCOVER (HOME) ============================= */
        function HomePage() {
            const [trending, setTrending] = useState(null);
            const [popular, setPopular] = useState(null);
            const [top, setTop] = useState(null);
            const [genre, setGenre] = useState("All");

                DataService.trending().then(setTrending).catch(() => SampleService.trending().then(setTrending));
                DataService.topRated().then(setTop).catch(() => SampleService.topRated().then(setTop));
            }, []);
            useEffect(() => {
                setPopular(null);
                DataService.popular(genre).then(setPopular).catch(() => SampleService.popular(genre).then(setPopular));
            }, [genre]);
            return <React.Fragment>
                <Hero />
                <div className="max-w-7xl mx-auto px-5 lg:px-8">
                    <Reveal className="mt-14">
                        <SectionHead title="Trending Now" link="#/explore" />
                        {trending === null
                            ? <div className="flex gap-4 overflow-hidden">{Array.from({ length: 7 }).map((_, i) => <Skel key={i} className="w-[146px] sm:w-[168px] lg:w-[188px] aspect-[2/3] shrink-0" />)}</div>
                            : <div className="flex gap-4 overflow-x-auto no-scrollbar snap-x pb-2 -mx-5 px-5 lg:mx-0 lg:px-0">
                                {trending.map(m => <PosterCard key={m.id} m={m} />)}
                            </div>}
                    </Reveal>
                    <Reveal className="mt-16">
                        <div className="flex flex-wrap items-end justify-between gap-4 mb-5">
                            <h2 className="font-display font-bold text-xl sm:text-2xl tracking-tight">Popular Movies</h2>
                            <a href="#/explore" className="group flex items-center gap-1.5 text-xs font-semibold text-cine-muted hover:text-white transition-colors">
                                View All <Icon name="arrow-right" size={13} className="transition-transform duration-300 group-hover:translate-x-1" /></a>
                        </div>
                        <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1 -mx-5 px-5 lg:mx-0 lg:px-0 mb-6">
                            {HOME_PILLS.map(g => <div key={g} className="shrink-0"><Pill active={genre === g} onClick={() => setGenre(g)}>{g}</Pill></div>)}
                        </div>
                        {popular === null
                            ? <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">{Array.from({ length: 12 }).map((_, i) => <Skel key={i} className="aspect-[2/3]" />)}</div>

                                ? <EmptyState title="Nothing here yet" text="No popular titles matched this genre right now." />
                                : <div key={genre} className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 fade-in">
                                    {popular.map(m => <PosterCard key={m.id} m={m} fluid />)}
                                </div>}
                    </Reveal>
                    <Reveal className="mt-16">
                        <SectionHead title="Top Rated" link="#/explore?sort=rating" />
                        {top === null
                            ? <div className="grid md:grid-cols-2 xl:grid-cols-3 gap-5">{Array.from({ length: 3 }).map((_, i) => <Skel key={i} className="aspect-[16/10]" />)}</div>
                            : <div className="grid md:grid-cols-2 xl:grid-cols-3 gap-5">
                                {top.map((m, idx) => <Reveal key={m.id} delay={idx * 70}><WideCard m={m} /></Reveal>)}

                    </Reveal>
                </div>
            </React.Fragment>;

        function EmptyState({ icon, title, text, children }) {
            return <div className="flex flex-col items-center justify-center text-center py-20 px-6">
                <div className="w-16 h-16 rounded-full border border-white/10 bg-white/[0.03] flex items-center justify-center text-cine-muted mb-5">
                    <Icon name={icon || "film"} size={24} />
                </div>
                <h3 className="font-display font-bold text-lg">{title}</h3>
                <p className="text-sm text-cine-muted mt-2 max-w-sm leading-relaxed">{text}</p>
                {children && <div className="mt-6 flex flex-wrap justify-center gap-3">{children}</div>}
            </div>;
        }

        /* ============================= EXPLORE ============================= */
        function ExplorePage({ route }) {
            const [q, setQ] = useState(route.query.q || "");
            const [debQ, setDebQ] = useState(route.query.q || "");
            const [genre, setGenre] = useState("All");
            const [sort, setSort] = useState(route.query.sort || "popularity");
            const [list, setList] = useState(null);
            const [count, setCount] = useState(12);
            useEffect(() => { setQ(route.query.q || ""); setDebQ(route.query.q || ""); }, [route.query.q]);
            useEffect(() => { if (route.query.sort) setSort(route.query.sort); }, [route.query.sort]);
            useEffect(() => { const t = setTimeout(() => setDebQ(q.trim()), 400); return () => clearTimeout(t); }, [q]);
            useEffect(() => {
                setList(null); setCount(12);
                DataService.explore({ query: debQ, genre, sort }).then(setList).catch(() => SampleService.explore({ query: debQ, genre, sort }).then(setList));
            }, [debQ, genre, sort]);
            const shown = list ? list.slice(0, count) : [];
            return <div className="max-w-7xl mx-auto px-5 lg:px-8 pt-28 lg:pt-32">
                <p className="text-[11px] font-bold tracking-[0.35em] text-cine-red mb-3">BROWSE THE CATALOGUE</p>
                <h1 className="font-display font-extrabold tracking-tight text-4xl sm:text-5xl">Explore Movies</h1>
                <p className="text-cine-muted text-sm mt-3 max-w-lg">Search thousands of titles, filter by genre and sort by what matters to you.</p>
                <div className="mt-8 flex flex-col lg:flex-row lg:items-center gap-4">
                    <div className="relative flex-1 max-w-xl">
                        <span className="absolute left-4 top-1/2 -translate-y-1/2 text-cine-muted"><Icon name="search" size={16} /></span>
                        <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search by title or keyword..."
                            className="w-full bg-white/[0.05] border border-white/10 rounded-full pl-11 pr-11 py-3.5 text-sm placeholder:text-cine-muted/70 outline-none focus:border-cine-red/50 focus:bg-white/[0.07] transition-all" />
                        {q && <button aria-label="Clear" onClick={() => setQ("")} className="absolute right-3 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full flex items-center justify-center text-cine-muted hover:text-white hover:bg-white/10 transition-all"><Icon name="x" size={14} /></button>}
                    </div>
                    <div className="relative shrink-0">
                        <span className="absolute left-4 top-1/2 -translate-y-1/2 text-cine-muted pointer-events-none"><Icon name="sliders-horizontal" size={14} /></span>
                        <select value={sort} onChange={e => setSort(e.target.value)} aria-label="Sort by"
                            className="appearance-none w-full lg:w-auto bg-cine-surface border border-white/10 rounded-full pl-10 pr-10 py-3.5 text-sm font-medium outline-none cursor-pointer focus:border-cine-red/50 transition-all">
                            <option value="popularity" className="bg-cine-surface">Sort: Popularity</option>
                            <option value="rating" className="bg-cine-surface">Sort: Rating</option>
                            <option value="date" className="bg-cine-surface">Sort: Release Date</option>
                        </select>
                        <span className="absolute right-4 top-1/2 -translate-y-1/2 text-cine-muted pointer-events-none"><Icon name="chevron-down" size={14} /></span>
                    </div>
                </div>
                <div className="mt-5 flex gap-2 overflow-x-auto no-scrollbar pb-1 -mx-5 px-5 lg:mx-0 lg:px-0">
                    {EXPLORE_GENRES.map(g => <div key={g} className="shrink-0"><Pill active={genre === g} onClick={() => setGenre(g)}>{g}</Pill></div>)}
                </div>
                <div className="mt-6 min-h-[300px]">
                    {list === null
                        ? <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">{Array.from({ length: 12 }).map((_, i) => <Skel key={i} className="aspect-[2/3]" />)}</div>
                        : list.length === 0
                            ? <EmptyState icon="search" title="No movies found" text={debQ ? `Nothing matched “${debQ}”. Try a different title or clear your filters.` : "No titles match the selected filters."}>
                                <button onClick={() => { setQ(""); setGenre("All"); setSort("popularity"); }}
                                    className="rounded-full bg-cine-red px-6 py-3 text-sm font-bold hover:bg-[#f3353b] transition-all active:scale-95">Clear Filters</button>
                            </EmptyState>
                            : <React.Fragment>
                                <p className="text-xs text-cine-muted mb-4">Showing <span className="text-white font-semibold">{shown.length}</span> of <span className="text-white font-semibold">{list.length}</span> titles{debQ && <React.Fragment> for “<span className="text-white">{debQ}</span>”</React.Fragment>}</p>
                                <div key={debQ + genre + sort} className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 fade-in">
                                    {shown.map(m => <PosterCard key={m.id} m={m} fluid />)}
                                </div>
                                {count < list.length && <div className="flex justify-center mt-10">
                                    <button onClick={() => setCount(c => c + 12)}
                                        className="rounded-full border border-white/15 bg-white/[0.04] px-8 py-3.5 text-sm font-semibold hover:border-cine-red/60 hover:bg-cine-red/10 transition-all duration-300 active:scale-95">
                                        Load More</button>
                                </div>}
                            </React.Fragment>}
                </div>
            </div>;
        }

        /* ============================= MOVIE DETAILS ============================= */
        function DetailsPage({ route }) {
            const id = +route.path.split("/")[2];
            const wl = useWatchlist();
            const [m, setM] = useState(null);
            const [err, setErr] = useState(false);
            useEffect(() => {
                setM(null); setErr(false);
                DataService.details(id).then(setM).catch(() => setErr(true));
            }, [id]);
            const goBack = () => { if (window.history.length > 1) window.history.back(); else window.location.hash = "#/"; };
            if (err) return <div className="pt-32"><EmptyState icon="triangle-alert" title="Couldn't load this movie"
                text="Something went wrong while fetching the details. Please try again.">
                <button onClick={goBack} className="rounded-full bg-cine-red px-6 py-3 text-sm font-bold hover:bg-[#f3353b] transition-all active:scale-95">Go Back</button>
            </EmptyState></div>;
            if (!m) return <div className="pt-16">
                <Skel className="h-[420px] rounded-none" />
                <div className="max-w-7xl mx-auto px-5 lg:px-8 -mt-32 relative flex flex-col md:flex-row items-start gap-8">
                    <Skel className="w-44 md:w-56 aspect-[2/3] shrink-0 self-start" />
                    <div className="flex-1 space-y-4 pt-4 md:pt-24"><Skel className="h-10 w-2/3" /><Skel className="h-4 w-1/3" /><Skel className="h-24 w-full" /></div>
                </div>
            </div>;
            const on = wl.has(m.id);
            const gs = movieGenres(m);
            return <div className="fade-in">
                <div className="relative h-[400px] sm:h-[460px] overflow-hidden">
                    <div className="absolute inset-0"><SmartImg src={IMG_BACKDROP(m.backdrop)} fallbackSrc={IMG_DIRECT_BACKDROP(m.backdrop) || PICSUM(m.id)} title={m.title} seed={m.id} wide className="h-full w-full" imgClass="kenburns" /></div>
                    <div className="absolute inset-0 bg-gradient-to-t from-cine-bg via-cine-bg/40 to-black/30" />
                    <div className="absolute inset-0 bg-gradient-to-r from-cine-bg/80 via-transparent to-transparent" />
                    <button onClick={goBack}
                        className="absolute top-24 left-5 lg:left-8 z-10 inline-flex items-center gap-2 rounded-full border border-white/15 bg-black/40 backdrop-blur-md px-5 py-2.5 text-sm font-semibold text-white/85 hover:bg-cine-red hover:border-cine-red hover:text-white transition-all duration-300 active:scale-95">
                        <Icon name="arrow-left" size={15} /> Back
                    </button>
                </div>
                <div className="max-w-7xl mx-auto px-5 lg:px-8">
                    <div className="relative -mt-36 sm:-mt-44 flex flex-col md:flex-row items-start gap-8">
                        <div className="w-40 sm:w-48 md:w-60 shrink-0 self-start rounded-xl overflow-hidden border border-white/10 shadow-[0_30px_60px_-15px_rgba(0,0,0,0.9)]">
                            <div className="aspect-[2/3] relative"><SmartImg src={IMG_POSTER(m.poster)} fallbackSrc={IMG_DIRECT_POSTER(m.poster)} title={m.title} year={m.year} seed={m.id} className="h-full w-full" /></div>
                        </div>
                        <div className="flex-1 md:pt-40 min-w-0">
                            {gs.length > 0 && <div className="flex flex-wrap gap-2 mb-3">
                                {gs.map(g => <a key={g} href="#/explore" className="rounded-full border border-white/10 bg-white/[0.04] px-3 py-1 text-[11px] font-semibold text-cine-muted hover:text-white hover:border-cine-red/50 transition-all">{g}</a>)}
                            </div>}
                            <h1 className="font-display font-extrabold tracking-tight text-3xl sm:text-4xl lg:text-5xl leading-tight">{m.title}</h1>
                            <div className="mt-4 flex flex-wrap items-center gap-x-5 gap-y-2 text-sm text-white/80">
                                <Rating value={m.rating} className="text-base" starSize={15} />
                                {m.year && <span className="flex items-center gap-1.5"><Icon name="calendar" size={14} className="text-cine-muted" />{m.year}</span>}
                                {m.runtime && <span className="flex items-center gap-1.5"><Icon name="clock" size={14} className="text-cine-muted" />{fmtRuntime(m.runtime)}</span>}
                                {m.director && <span className="text-white/60">Dir. <span className="text-white font-medium">{m.director}</span></span>}
                            </div>
                            <div className="mt-6 flex flex-wrap gap-3">
                                <a href={trailerUrl(m)} target="_blank" rel="noopener"
                                    className="inline-flex items-center gap-2.5 rounded-lg bg-cine-red px-6 py-3.5 text-sm font-bold shadow-[0_12px_35px_-8px_rgba(229,36,42,0.65)] hover:bg-[#f3353b] transition-all duration-300 active:scale-95">
                                    <Icon name="play" size={16} filled /> Watch Trailer
                                </a>
                                <button onClick={() => wl.toggle(m)}
                                    className={"inline-flex items-center gap-2.5 rounded-lg px-6 py-3.5 text-sm font-semibold border transition-all duration-300 active:scale-95 " +
                                        (on ? "border-cine-red/60 bg-cine-red/10 text-white" : "border-white/20 bg-white/[0.05] hover:border-white/45 hover:bg-white/[0.1]")}>
                                    <Icon name={on ? "check" : "plus"} size={16} /> {on ? "In Watchlist" : "Add to Watchlist"}
                                </button>
                            </div>
                            {m.overview && <div className="mt-8 max-w-3xl">
                                <h2 className="text-xs font-bold tracking-[0.25em] text-cine-muted mb-3">SYNOPSIS</h2>
                                <p className="text-[15px] leading-relaxed text-white/75">{m.overview}</p>
                            </div>}
                            {m.cast && m.cast.length > 0 && <div className="mt-8">
                                <h2 className="text-xs font-bold tracking-[0.25em] text-cine-muted mb-3">TOP CAST</h2>
                                <div className="flex flex-wrap gap-2">
                                    {m.cast.map((p, idx) => <span key={idx} className="rounded-full border border-white/10 bg-white/[0.04] px-4 py-2 text-xs">
                                        <span className="font-semibold text-white">{p.name}</span>
                                        {p.character && <span className="text-cine-muted"> · {p.character}</span>}
                                    </span>)}
                                </div>
                            </div>}
                        </div>
                    </div>
                    {m.similar && m.similar.length > 0 && <Reveal className="mt-16">
                        <SectionHead title="More Like This" />
                        <div className="flex gap-4 overflow-x-auto no-scrollbar snap-x pb-2 -mx-5 px-5 lg:mx-0 lg:px-0">
                            {m.similar.map(s => <PosterCard key={s.id} m={s} />)}
                        </div>
                    </Reveal>}
                </div>
            </div>;
        }

        /* ============================= WATCHLIST ============================= */
        function WatchlistPage() {
            const auth = useAuth();
            const wl = useWatchlist();
            const toast = useToast();

            useEffect(() => {
                if (!auth.isAuth) {
                    toast.show("Please sign in to access your Watchlist", "bookmark");
                    auth.openAuth("signin", { reason: "watchlist" });
                }
            }, [auth.isAuth]);

            if (!auth.isAuth) {
                return (
                    <div className="max-w-7xl mx-auto px-5 lg:px-8 pt-28 lg:pt-36 pb-20 min-h-[65vh] flex items-center justify-center">
                        <div className="w-full max-w-lg p-8 sm:p-10 rounded-3xl bg-cine-elev/95 border border-white/10 backdrop-blur-2xl shadow-2xl shadow-black/80 text-center fade-in">
                            <div className="w-16 h-16 rounded-2xl bg-cine-red/15 border border-cine-red/35 flex items-center justify-center text-cine-red mx-auto mb-5 shadow-[0_0_30px_rgba(229,36,42,0.3)]">
                                <Icon name="lock" size={28} />
                            </div>
                            <span className="inline-block px-3 py-1 rounded-full bg-cine-red/10 border border-cine-red/30 text-[11px] font-bold tracking-wider text-cine-red uppercase mb-3">
                                Sign In Required
                            </span>
                            <h2 className="font-display font-extrabold text-2xl sm:text-3xl text-white tracking-tight">Your Watchlist is Locked</h2>
                            <p className="text-cine-muted text-sm mt-3 leading-relaxed">
                                Curate your favorite movies, track what you want to watch next, and synchronize your collection across all devices with a free CiNE account.
                            </p>
                            <div className="mt-7 flex flex-col sm:flex-row gap-3 justify-center">
                                <button onClick={() => auth.openAuth("signin", { reason: "watchlist" })}
                                    className="rounded-full bg-cine-red hover:bg-[#f3353b] px-6 py-3.5 text-xs font-bold text-white tracking-wider uppercase transition-all shadow-[0_10px_25px_-5px_rgba(229,36,42,0.6)] active:scale-95 flex items-center justify-center gap-2">
                                    <Icon name="user" size={15} /> Sign In / Register
                                </button>
                                <a href="#/"
                                    className="rounded-full border border-white/15 bg-white/[0.04] hover:bg-white/[0.08] hover:border-white/30 px-6 py-3.5 text-xs font-semibold text-white/80 tracking-wider uppercase transition-all active:scale-95 flex items-center justify-center gap-2">
                                    <Icon name="compass" size={15} /> Discover Movies
                                </a>
                            </div>
                        </div>
                    </div>
                );
            }

            return <div className="max-w-7xl mx-auto px-5 lg:px-8 pt-28 lg:pt-32 min-h-[60vh]">
                <p className="text-[11px] font-bold tracking-[0.35em] text-cine-red mb-3">YOUR COLLECTION</p>
                <div className="flex flex-wrap items-end gap-4">
                    <h1 className="font-display font-extrabold tracking-tight text-4xl sm:text-5xl">My Watchlist</h1>
                    {wl.items.length > 0 && <span className="mb-1.5 rounded-full border border-white/10 bg-white/[0.04] px-3.5 py-1.5 text-xs font-semibold text-cine-muted">
                        {wl.items.length} {wl.items.length === 1 ? "title" : "titles"}</span>}
                </div>
                <p className="text-cine-muted text-sm mt-3 max-w-lg">Everything you've saved to watch later — synchronized with your CiNE account.</p>
                <div className="mt-10">
                    {wl.items.length === 0
                        ? <EmptyState icon="popcorn" title="Your watchlist is empty"
                            text="Browse trending and popular titles, then tap the + button on any movie to save it here for later.">
                            <a href="#/" className="rounded-full bg-cine-red px-6 py-3 text-sm font-bold hover:bg-[#f3353b] transition-all active:scale-95 inline-flex items-center gap-2"><Icon name="compass" size={15} /> Discover Movies</a>
                            <a href="#/explore" className="rounded-full border border-white/15 bg-white/[0.04] px-6 py-3 text-sm font-semibold hover:border-white/40 transition-all active:scale-95">Explore Catalogue</a>
                        </EmptyState>
                        : <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 fade-in">
                            {wl.items.map(m =>
                                <div key={m.id} className="relative group/wl">
                                    <PosterCard m={m} fluid />
                                    <button aria-label={"Remove " + m.title} onClick={() => wl.remove(m.id)}
                                        className="absolute top-2.5 left-2.5 z-10 w-8 h-8 rounded-full bg-black/60 border border-white/15 backdrop-blur-md flex items-center justify-center text-white/80 opacity-0 group-hover/wl:opacity-100 hover:bg-cine-red hover:border-cine-red transition-all duration-300 active:scale-90">
                                        <Icon name="trash-2" size={14} />
                                    </button>
                                </div>)}
                        </div>}
                </div>
            </div>;
        }

        /* ============================= FOOTER ============================= */
        function Footer() {
            const social = [["instagram", "https://instagram.com"], ["youtube", "https://youtube.com"], ["github", "https://github.com"]];
            return <footer className="mt-24 border-t border-white/[0.06]">
                <div className="max-w-7xl mx-auto px-5 lg:px-8 py-12 flex flex-col md:flex-row md:items-center gap-10 justify-between">
                    <div>
                        <Logo />
                        <p className="text-sm text-cine-muted mt-3">Discover. Explore. Watch. Repeat.</p>
                    </div>
                    <nav className="flex flex-wrap gap-x-8 gap-y-3 text-sm">
                        <a href="#/" className="text-cine-muted hover:text-white transition-colors">About</a>
                        <a href="https://www.themoviedb.org" target="_blank" rel="noopener" className="text-cine-muted hover:text-white transition-colors">API Attribution</a>
                        <a href="mailto:hello@cine.example" className="text-cine-muted hover:text-white transition-colors">Contact</a>
                    </nav>
                    <div className="flex gap-3">
                        {social.map(([icon, url]) =>
                            <a key={icon} href={url} target="_blank" rel="noopener" aria-label={icon}
                                className="w-10 h-10 rounded-full border border-white/10 flex items-center justify-center text-cine-muted hover:text-white hover:border-cine-red hover:bg-cine-red/10 transition-all duration-300 active:scale-90">
                                <Icon name={icon} size={16} />
                            </a>)}
                    </div>
                </div>
                <div className="border-t border-white/[0.04]">
                    <div className="max-w-7xl mx-auto px-5 lg:px-8 py-5 flex flex-col sm:flex-row gap-2 items-center justify-between text-xs text-cine-muted/70">
                        <span>© {new Date().getFullYear()} CiNE.. All rights reserved.</span>
                        <span>This product uses the TMDB API but is not endorsed or certified by TMDB.</span>
                    </div>
                </div>
            </footer>;
        }

        /* ============================= APP ============================= */
        function App() {
            const route = useRoute();
            useEffect(() => { window.scrollTo({ top: 0, behavior: "instant" }); }, [route.path]);
            let page;
            if (route.path.startsWith("/movie/")) page = <DetailsPage route={route} />;
            else if (route.path.startsWith("/explore")) page = <ExplorePage route={route} />;
            else if (route.path.startsWith("/watchlist")) page = <WatchlistPage />;
            else page = <HomePage />;
            return <ToastProvider><AuthProvider><WatchlistProvider>
                <Navbar route={route} />
                <main key={route.path} className="page-enter min-h-[70vh]">{page}</main>
                <Footer />
                <AuthModal />
            </WatchlistProvider></AuthProvider></ToastProvider>;
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>

</html>
